<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Window chrome follows the system scheme; the manual theme toggle rewrites both contents at runtime. -->
    <meta name="theme-color" content="#0C3A30" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07201B" media="(prefers-color-scheme: dark)" />
    <title>Vila Noel do Bem — vila natalina virtual em 3D</title>
    <meta name="description" content="Entre em uma vila natalina em 3D, brinque gratuitamente e descubra organizações que fazem a diferença." />
    <link rel="canonical" href="https://www.vilanoeldobem.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.vilanoeldobem.com.br/" />
    <meta property="og:title" content="Vila Noel do Bem" />
    <meta property="og:description" content="Um mundo para explorar. Um lugar para sua causa ser descoberta." />
    <meta property="og:image" content="https://www.vilanoeldobem.com.br/img/brand-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo da Vila Noel do Bem" />
    <!-- analytics:start -->
    <script src="/gtag-init.js"></script>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MQP2RVMB"></script>
    <!-- analytics:end -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Applies the saved theme before first paint (no inline script: the CSP forbids it). -->
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/img/praca.webp" type="image/webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <!-- Fixed light card in both colour schemes: its text colours inherit from it, never from the theme tokens. -->
      <div style="max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; font-family: Nunito, system-ui, sans-serif; color: #112821; background: #fdf9ef;">
        <h1 style="font-family: Fredoka, Nunito, sans-serif; color: inherit;">Um mundo para explorar. Um lugar para sua causa ser descoberta.</h1>
        <p>Entre em uma vila natalina em 3D, brinque gratuitamente e descubra organizações que fazem a diferença.</p>
        <p><a href="https://play.vilanoeldobem.com.br">Explorar a Vila agora</a></p>
        <p>As doações pela Vila ainda não estão disponíveis. O cadastro e o formulário de candidatura ainda não estão abertos na versão pública.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
