# Copies the Resend API key from GitHub secrets to the production API Worker (IMPL-0012).
# Manual only: it runs when a person clicks "Run workflow", never on push or pull request.
# Needs two repository secrets: RESEND_API_KEY and CLOUDFLARE_API_TOKEN. Scope the Cloudflare token to
# "Workers Scripts: Edit" on this account only.
# Setting a Worker secret publishes a new version of the Worker with the same code.
#
# This job handles secrets, so it runs no third-party action and pins the GitHub-owned ones to a commit SHA
# (a tag can be moved; a SHA cannot). pnpm comes from Corepack at the version in package.json "packageManager",
# and dependencies install from the lockfile.
name: api-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-secrets
  cancel-in-progress: false

jobs:
  resend-api-key:
    name: set RESEND_API_KEY on vilanoeldobem-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set the Worker secret
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          test -n "$RESEND_API_KEY" || { echo "::error::repository secret RESEND_API_KEY is not set"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::repository secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          printf '%s' "$RESEND_API_KEY" | pnpm exec wrangler secret put RESEND_API_KEY --env=""
      - name: Check that the API reports the key
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS https://api.vilanoeldobem.com.br/health | grep -q '"mail":true' && { echo "mail key is live"; exit 0; }
            sleep 10
          done
          echo "::error::/health does not report \"mail\":true (is the API deployed with IMPL-0012?)"
          exit 1
