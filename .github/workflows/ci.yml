# CI gate: every pull request and every push to main must typecheck, test and build (ROADMAP item
# "Infraestrutura de entrega" #1). Read-only: no secrets, no deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Local media and progress lifecycle (workerd, D1, R2)
        run: node scripts/verify-media-local.mjs --progress
        timeout-minutes: 3
      - name: Install pinned Chromium for the existing account flow
        run: pnpm --filter @vila/client exec playwright-core install --with-deps chromium
      - name: Build loopback game and dashboard assets
        run: |
          pnpm --filter @vila/client run build:local
          pnpm --filter @vila/dash run build:local
      - name: Browser account and file flow (analytics stubbed)
        run: |
          CHROMIUM_PATH="$(pnpm --filter @vila/client exec node -p 'require("playwright-core").chromium.executablePath()')" node scripts/verify-media-local.mjs --browser
        timeout-minutes: 9
