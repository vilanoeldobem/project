# CI gate: every pull request and every push to main must typecheck, test and build (ROADMAP item
# "Infraestrutura de entrega" #1). Read-only: no secrets, no deploy.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Local media lifecycle (workerd, D1, R2)
        run: node scripts/verify-media-local.mjs
        timeout-minutes: 3
